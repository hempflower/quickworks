name: Draft Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.0"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix web

      - name: Build frontend assets
        run: npm run build --prefix web

      - name: Build Linux amd64 release archive
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME}"
          BUILD_DATE="$(date --utc +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w -X github.com/evanxiao/quickworks/internal/buildinfo.Version=${VERSION} -X github.com/evanxiao/quickworks/internal/buildinfo.Commit=${GITHUB_SHA} -X github.com/evanxiao/quickworks/internal/buildinfo.BuildDate=${BUILD_DATE}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o dist/quickworks ./cmd/quickworks
          ARCHIVE="quickworks-${VERSION}-linux-amd64.tar.gz"
          tar -C dist -czf "dist/${ARCHIVE}" quickworks
          sha256sum "dist/${ARCHIVE}" > "dist/${ARCHIVE}.sha256"

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
